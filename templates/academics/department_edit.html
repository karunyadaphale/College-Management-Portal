{% extends 'base.html' %}

{% block title %}Edit Department - {{ dept.name }}{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <div class="col-lg-7 mx-auto">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-bold">Edit Department: {{ dept.code }}</h5>
          <a href="{% url 'academics:department_list' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{% url 'academics:department_edit' dept.code %}">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold">Department Code</label>
              <input type="text" class="form-control bg-light" value="{{ dept.code }}" disabled readonly>
            </div>

            <div class="mb-3">
              <label for="name" class="form-label fw-semibold">Department Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="name" name="name" value="{{ dept.name }}" required>
            </div>

            <div class="mb-3">
              <label for="hod" class="form-label fw-semibold">Head of Department (HOD)</label>
              <input type="text" class="form-control" id="hod" name="hod" value="{{ dept.hod|default:'' }}">
            </div>

            <div class="mb-3">
              <label for="established_year" class="form-label fw-semibold">Established Year</label>
              <input type="number" class="form-control" id="established_year" name="established_year" value="{{ dept.established_year|default:'2015' }}">
            </div>

            <div class="mb-3">
              <label for="description" class="form-label fw-semibold">Description</label>
              <textarea class="form-control" id="description" name="description" rows="3">{{ dept.description|default:'' }}</textarea>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
              <a href="{% url 'academics:department_list' %}" class="btn btn-outline-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary px-4">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
